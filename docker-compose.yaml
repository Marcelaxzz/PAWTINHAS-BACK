services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pawtinhas-api
    # Mesma porta da API no "dotnet run": o site (proxy do Vite) e o app mobile já apontam para ela.
    ports:
      - "5135:8080"
    environment:
      # Development permite cookies sem HTTPS (http://localhost). Em produção, publique atrás de HTTPS
      # e troque para Production.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD}"
      BancoDeDados__MigrarAoIniciar: "true"
      Jwt__Chave: ${JWT_CHAVE:?Defina JWT_CHAVE no .env}
      Email__Senha: ${EMAIL_SENHA_APP:-}
      Email__Modo: "Pasta"
      Dispositivo__Chave: ${DISPOSITIVO_CHAVE:-}
    volumes:
      - pawtinhas_dados:/app/dados
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: pawtinhas-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 3307 no computador, para não conflitar com um MySQL já instalado no Windows (3306).
    ports:
      - "3307:3306"
    volumes:
      - pawtinhas_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  pawtinhas_mysql_data:
  # Fotos enviadas e backups automáticos.
  pawtinhas_dados:
