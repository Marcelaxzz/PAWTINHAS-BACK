; Alarme de medicação do Pawtinhas (ESP32 + LCD 16x2 I2C + buzzer).
; Abra esta pasta no VS Code com a extensão PlatformIO e use Build / Upload / Monitor.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Duas áreas de programa de 1,9 MB: cabe o programa e permite regravar pela rede (sem cabo).
board_build.partitions = min_spiffs.csv
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    bblanchon/ArduinoJson@^7.2.1

; Gravar sem cabo, pelo Wi-Fi: a placa precisa estar ligada e na mesma rede do computador.
; A primeira gravação deste programa tem que ser pelo cabo (env:esp32dev).
; Se o computador não achar "pawtinhas-alarme.local", troque pelo IP que aparece no display (toque no BOOT).
[env:sem-cabo]
extends = env:esp32dev
upload_protocol = espota
upload_port = pawtinhas-alarme.local
extra_scripts = pre:senha_ota.py
